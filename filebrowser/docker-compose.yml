services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./database.db:/database.db
      - /data/home:/srv
    ports:
      - "8083:80"
    environment:
      - TZ=Asia/Ho_Chi_Minh
