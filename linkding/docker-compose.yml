services:
  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./data:/etc/linkding/data
    ports:
      - "8085:9090"
    environment:
      - TZ=Asia/Ho_Chi_Minh
