services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./vw-data:/data
    ports:
      - "8082:80"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SIGNUPS_ALLOWED=false
      - WEBSOCKET_ENABLED=true
