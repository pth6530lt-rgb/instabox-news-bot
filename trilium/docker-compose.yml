services:
  trilium:
    image: triliumnext/trilium:latest
    container_name: trilium
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./data:/home/node/trilium-data
    ports:
      - "8084:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - TRILIUM_DATA_DIR=/home/node/trilium-data
