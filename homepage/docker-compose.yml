services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "3002:3000"
    volumes:
      - ./config:/app/config
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PUID=1000
      - PGID=1000
      # Ban Homepage moi bat buoc khai bao host duoc phep, neu khong se tra
      # loi 400 "Host validation failed" ca khi mo bang localhost lan link
      # private cua InstaBox. Host instabox.tech nay la host cua cong 3002,
      # khong chua token, token nam trong query ?_token=... nen van an toan.
      - HOMEPAGE_ALLOWED_HOSTS=localhost:3000,localhost:3002,127.0.0.1:3000,127.0.0.1:3002,3002-agqycf5tysdh6a6vrvqcwkgwzy.instabox.tech
